# Vector sidecar config for Ansina's Dev Mode (issue #62). Static and
# hand-editable, never daemon-generated — no second config copy to drift against,
# and secrets reach this process only via environment variables Ansina itself
# injects at spawn time (see `ansina.dev.vector.build_vector_env`), never written
# to any file Vector reads.
#
# Three independent source/sink pairs, matching the hive-partitioned bucket
# layout `src/ansina/heart/eval/storage.py`'s own module docstring already
# documents:
#   samples*.jsonl  -> host=<id>/kind=telemetry/dt=<date>/...
#   log*.jsonl      -> host=<id>/kind=runlog/dt=<date>/...
#   opencode*.jsonl -> host=<id>/kind=opencode/dt=<date>/...  (issue #76)
#
# `host=<id>/` (issue #67) is what makes two deployments shipping to the same
# bucket distinguishable — `<id>` is `ANSINA_TELEMETRY_HOST_ID`, resolved by
# `ansina.dev.vector.resolve_host_id` and injected by `build_vector_env`, never
# read from this file's own environment directly.
#
# Validate with `make vector-validate` (wraps `scripts/vector-validate.sh`) — the
# daemon's own `ansina.dev.vector.preflight()` runs the identical `vector validate`
# invocation (real interpolation, `--skip-healthchecks`) before ever spawning this
# config for real.
#
# KNOWN UPSTREAM RISK (watch, do not assume solved): vectordotdev/vector#23875 —
# the aws_s3 sink's disk buffer can grow unbounded in memory during a prolonged
# upload outage. Mitigations already in scope elsewhere: issue #61's own spool
# byte cap bounds how much *source* data can ever exist to buffer, and this
# issue's post-spawn liveness check surfaces an outright-dead sidecar. Neither is
# a fix for the upstream issue itself.

data_dir = "${ANSINA_TELEMETRY_VECTOR_DATA_DIR}"

[api]
enabled = false

# --- samples.jsonl -> kind=telemetry/ -------------------------------------------

[sources.telemetry_samples]
type = "file"
include = ["${ANSINA_TELEMETRY_SPOOL_DIR}/samples*.jsonl"]
read_from = "beginning"

[sinks.telemetry_samples_s3]
type = "aws_s3"
inputs = ["telemetry_samples"]
bucket = "${ANSINA_TELEMETRY_S3_BUCKET}"
region = "${ANSINA_TELEMETRY_S3_REGION}"
endpoint = "${ANSINA_TELEMETRY_S3_ENDPOINT_URL}"
key_prefix = "${ANSINA_TELEMETRY_S3_KEY_PREFIX}host=${ANSINA_TELEMETRY_HOST_ID}/kind=telemetry/dt=%Y-%m-%d/"
compression = "none"
force_path_style = true
# Dev Mode is a lab posture, not a tuned production pipeline — a short batch
# timeout favors fast feedback (an operator watching the bucket fill) over
# fewer/larger PUTs. Revisit if/when this config ever serves outside Dev Mode.
batch.timeout_secs = 5

[sinks.telemetry_samples_s3.encoding]
codec = "text"
framing.method = "newline_delimited"

[sinks.telemetry_samples_s3.buffer]
type = "disk"
max_size = 268435488
when_full = "block"

# --- log.jsonl -> kind=runlog/ ---------------------------------------------------

[sources.telemetry_log]
type = "file"
include = ["${ANSINA_TELEMETRY_SPOOL_DIR}/log*.jsonl"]
read_from = "beginning"

[sinks.telemetry_log_s3]
type = "aws_s3"
inputs = ["telemetry_log"]
bucket = "${ANSINA_TELEMETRY_S3_BUCKET}"
region = "${ANSINA_TELEMETRY_S3_REGION}"
endpoint = "${ANSINA_TELEMETRY_S3_ENDPOINT_URL}"
key_prefix = "${ANSINA_TELEMETRY_S3_KEY_PREFIX}host=${ANSINA_TELEMETRY_HOST_ID}/kind=runlog/dt=%Y-%m-%d/"
compression = "none"
force_path_style = true
batch.timeout_secs = 5

[sinks.telemetry_log_s3.encoding]
codec = "text"
framing.method = "newline_delimited"

[sinks.telemetry_log_s3.buffer]
type = "disk"
max_size = 268435488
when_full = "block"

# --- opencode*.jsonl -> kind=opencode/ -------------------------------------------
# The third telemetry shape (issue #76): one JSON line per run-lifecycle event,
# produced by `ansina.opencode.telemetry.OpencodeTelemetryWriter` through its own
# `SpooledRotatingWriter(file_prefix="opencode")` family — same generic writer,
# same budget knobs, as the two pairs above. No new env var: `ANSINA_TELEMETRY_
# SPOOL_DIR`/`_S3_*`/`_HOST_ID` are already injected by `build_vector_env`.

[sources.opencode_events]
type = "file"
include = ["${ANSINA_TELEMETRY_SPOOL_DIR}/opencode*.jsonl"]
read_from = "beginning"

[sinks.opencode_events_s3]
type = "aws_s3"
inputs = ["opencode_events"]
bucket = "${ANSINA_TELEMETRY_S3_BUCKET}"
region = "${ANSINA_TELEMETRY_S3_REGION}"
endpoint = "${ANSINA_TELEMETRY_S3_ENDPOINT_URL}"
key_prefix = "${ANSINA_TELEMETRY_S3_KEY_PREFIX}host=${ANSINA_TELEMETRY_HOST_ID}/kind=opencode/dt=%Y-%m-%d/"
compression = "none"
force_path_style = true
batch.timeout_secs = 5

[sinks.opencode_events_s3.encoding]
codec = "text"
framing.method = "newline_delimited"

[sinks.opencode_events_s3.buffer]
type = "disk"
max_size = 268435488
when_full = "block"
