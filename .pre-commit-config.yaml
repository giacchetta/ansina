# Scaffolding only — full wiring (and parity guarantee with CI) lands in #7.
# mypy and pytest hooks are intentionally NOT added here yet; #7 wires them
# so local pre-commit and CI never disagree.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
