[project]
name = "ansina"
dynamic = ["version"]
description = "Self-owned AI agent: an always-on in-process Heart plus a remote Brain, exposed over a single internal REST API."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [
    { name = "Luciano Giacchetta", email = "ldgiacchetta@gmail.com" },
]
dependencies = [
    "anyio>=4.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # The `BrainProvider` port's OpenAI-compatible adapter (issue #12,
    # `ansina.brain.adapters.openai_compat`). Unlike `ansina[mlx]` below, this is a
    # base dependency, not an optional extra: it's pure Python, installs on every CI
    # leg, and both legs exercise it (the Brain being disabled by default is a config
    # default, not a platform constraint the way MLX is). Floor set at the version the
    # adapter was actually built and tested against (3.5.0) — the SDK has made
    # breaking major-version changes before (e.g. its transport moved to `httpx2`), so
    # an untested older floor would be a false promise of compatibility.
    "openai>=3.5",
    # Password hashing for the RBAC identity model (issue #24, `ansina.auth.hashing`).
    # argon2id has no stdlib implementation; this is a base dependency, not an extra —
    # unlike `ansina[mlx]`, auth is not optional and both CI legs must exercise it.
    # Ships prebuilt wheels for macos-arm64 and linux-x86_64, so neither leg compiles
    # from source.
    "argon2-cffi>=25.1",
]

# `mlx` — the only HeartRuntime adapter shipped by issue #10 — is an *optional* extra,
# not a base dependency: it's Apple-Silicon-only, and CI never installs it (both legs
# run with the Heart disabled). A portable, non-Apple-Silicon fallback
# (llama-cpp-python) is deferred to a follow-up issue — see `ansina.heart.adapters`.
[project.optional-dependencies]
mlx = [
    "mlx-lm>=0.31.3",
    # Floor bumped past the 0.x -> 1.x major boundary to the version actually
    # resolved/locked (1.28.0) — an untested pre-1.0 floor was a false promise of
    # compatibility, the same reasoning as `openai`'s floor above.
    "huggingface-hub>=1.28",
]

[project.scripts]
ansina = "ansina.__main__:main"

[dependency-groups]
dev = [
    "ruff>=0.8",
    # Floors below bumped past a major-version boundary to the version actually
    # resolved/locked and tested against — an untested older floor was a false
    # promise of compatibility, the same reasoning as `openai`'s floor above.
    # `pytest-asyncio` in particular changed its default fixture loop scope at 1.0.
    "mypy>=2.3",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "httpx>=0.27",
    "httpx2>=2.12",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/ansina/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ansina"]

[tool.ruff]
target-version = "py314"
src = ["src", "tests"]
extend-exclude = ["openclaw-main"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ANN", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "tests"]
warn_unreachable = true
# tests/unit/**/conftest.py collide by module name (e.g. api/conftest.py vs
# logging/conftest.py) since tests/ has no __init__.py files; these two
# settings resolve modules by file path instead of requiring unique names.
mypy_path = "src"
explicit_package_bases = true

# `ansina[mlx]` is an optional extra CI never installs (see `[project.optional-
# dependencies]`) — neither package ships type stubs anyway, so mypy would otherwise
# fail to resolve `heart/adapters/mlx.py` and `heart/models.py`'s imports regardless
# of whether the extra is present.
[[tool.mypy.overrides]]
module = ["mlx", "mlx.*", "mlx_lm", "mlx_lm.*", "huggingface_hub", "huggingface_hub.*"]
ignore_missing_imports = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = [
    'if __name__ == "__main__":',
    "# unreachable",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# `--import-mode=importlib`: `tests/` has no `__init__.py` files (see `[tool.mypy]`'s
# comment above), so pytest's default "prepend" import mode fails as soon as two test
# modules share a basename across different subpackages — issue #12 adds `ansina.brain
# .selection`, which collides with `ansina.heart.selection`'s already-existing
# `test_selection.py` under that default mode. `importlib` mode resolves modules by
# file path instead, the same reasoning `[tool.mypy]`'s `explicit_package_bases`
# already applies on the type-checking side.
addopts = "--cov=src/ansina --import-mode=importlib"
filterwarnings = [
    # `TestClient`'s anyio blocking-portal teardown can finalize a request-opened
    # sqlite3.Connection outside `Database.close()`'s own cleanup path, under GC
    # timing that only shows up when tests/e2e's subprocess/thread activity shares
    # the session with tests/unit. Verified harmless: `tests/unit/storage/` proves
    # `Database.close()` itself closes everything it owns (including cross-thread
    # connections) with zero warnings in isolation, and production (`uv run ansina`)
    # never goes through TestClient/anyio's portal — uvicorn drives the lifespan
    # directly. Scoped to this exact message so an unrelated future leak still fails.
    "ignore:unclosed database.*:ResourceWarning",
]
