# Example Ansina configuration file.
#
# Copy this to `ansina.toml` (gitignored — never commit machine-specific config) and
# edit as needed. Every value shown below is already the built-in default, so this
# file exists purely to document the shape of the config; Ansina runs fine without it.
#
# Precedence, lowest to highest: built-in defaults -> ansina.toml -> ANSINA_* env vars.
# `ANSINA_CONFIG_FILE` points at a different file than the default `./ansina.toml`.

[server]
host = "127.0.0.1"
port = 8000

[logging]
level = "INFO"

[database]
# A relative path resolves against the process's working directory at startup — fine
# when launched from the repo root, ambiguous once Ansina runs as a service. Prefer an
# absolute path (or "~/..." — "~" is expanded) once the database needs to live
# somewhere else, e.g. a larger disk. WAL mode creates "<path>-wal" and "<path>-shm"
# sidecar files next to it; move all three together.
path = "ansina.db"

[heart]
# The in-process Heart runtime (issue #10). Off by default: no capability probe
# runs, no model loads, and "/readyz" carries no "heart" key at all. Turning this on
# requires the "mlx" extra ("uv sync --extra mlx") and only runs on Apple Silicon —
# a portable fallback is tracked in a follow-up issue, not shipped yet.
enabled = false

# "auto" and "mlx" currently behave identically (MLX is the only adapter); "auto"
# exists so a future adapter can be added without a config break.
runtime = "auto"

# An explicit local path always wins over model_repo below, and is used as-is with
# no network access. Leave unset to fetch model_repo instead.
# model_path = "/path/to/a/local/mlx/model"

# Hugging Face repo id, fetched into cache_dir on first use and reused after —
# ignored when model_path is set.
model_repo = "mlx-community/Qwen3-4B-Instruct-2507-4bit"

# Download-once model cache. Same "~" expansion / relative-path-resolves-to-CWD
# behavior as [database] path above.
cache_dir = "~/.cache/ansina/models"

# Hard ceiling, not a target (blueprint §3) — every prompt built for the Heart must
# fit inside this budget. 8192 is the maximum accepted here.
context_tokens = 8192
max_output_tokens = 512

[heart.tick]
# The autonomic tick loop (issue #11): on a fixed cadence, the Heart decides
# idle/act/escalate. Only runs when [heart] enabled = true above; this flag lets the
# Heart load (e.g. to back a future direct-generate use) without also ticking.
enabled = true

# Seconds between ticks.
interval_seconds = 30.0

# Uniform random delay added to each wakeup, so a restarted process doesn't tick in
# lockstep with anything else on a fixed cadence. 0 disables jitter.
jitter_seconds = 3.0

[brain]
# The remote Brain provider (issue #12). Off by default: "build_brain_provider" is
# never called and "app.state.brain" stays "None". Independent of [heart] — the Brain
# has no dependency on the Heart being enabled.
enabled = false

# Any OpenAI-compatible chat-completions endpoint: OpenAI itself, an
# Anthropic-via-compat-shim, OpenRouter, or a self-hosted server. A keyless request
# against this default host is refused at startup; point this at a keyless custom
# endpoint instead if that's what you're running.
base_url = "https://api.openai.com/v1"
model = "gpt-4o-mini"

timeout_seconds = 60.0
max_output_tokens = 2048

# Bounded retry: only retries a classified-retryable failure, and only before any
# text has reached the caller. "max_retries = 0" disables retry entirely.
max_retries = 3
retry_initial_backoff_seconds = 1.0
retry_max_backoff_seconds = 30.0

# Optional. With no price configured (the default), recorded usage carries no
# "cost_usd" figure rather than a fabricated one.
# price_per_1m_input_tokens = 0.15
# price_per_1m_output_tokens = 0.60

[security]
# RBAC identity model (issue #24). true (the default) means authentication is
# enforced: on first boot with no users, Ansina generates its own high-entropy
# bootstrap API token, prints it to stdout exactly once, and stores only its hash —
# never in this file, never recoverable afterward. false disables authentication
# entirely (every route except /healthz and /readyz reachable with no token) and is
# only accepted when [server] host is loopback (127.0.0.1, ::1, localhost) — Ansina
# refuses to expose an unauthenticated API off the local machine.
enabled = true

# On first boot with no users, this resolves to a single synthetic Admin identity so
# the service stays reachable. Set this to false once a real Admin account exists to
# revoke that bootstrap identity's credential (its user record and audit trail are
# kept, only the credential is removed).
bootstrap_admin_enabled = true

[security.password]
# Tunable argon2id work factors (issue #24). Defaults follow the OWASP-recommended
# argon2id baseline — high enough to make brute-forcing a stolen hash expensive, low
# enough not to dominate a login request.
time_cost = 3
memory_cost_kib = 65536
parallelism = 4

[security.sudo]
# Sudo step-up (issue #26): a Maintain caller must present a live grant on any
# sensitive auth.* action (Admin never does). Get one via POST /auth/sudo (body:
# {"password": "..."}), present it back as the X-Sudo-Token header.

# How long an issued grant stays valid.
ttl_seconds = 600.0

# N consecutive failed step-up attempts within attempt_window_seconds locks further
# attempts out for lockout_seconds (429 with a Retry-After header).
max_failed_attempts = 5
attempt_window_seconds = 300.0
lockout_seconds = 900.0

# api_token (issue #24) is an *optional* override of the auto-generated bootstrap
# token above — e.g. for a scripted/orchestrated install or CI that needs a token
# known ahead of time. Prefer letting Ansina generate its own; a manually-supplied
# value must look like a securely generated one (32+ chars, letters/digits/-/_ only,
# high enough entropy) — a human-typed phrase like "Hello, World" is rejected
# outright. Like every secret, it is env-only — setting it in this file is a hard
# startup error:
#   ANSINA_SECURITY__API_TOKEN=...
#   ANSINA_BRAIN__API_KEY=...
#
# Generate a strong one with e.g.:
#   python -c "import secrets; print(secrets.token_urlsafe(32))"
