# Example Ansina configuration file.
#
# Copy this to `ansina.toml` (gitignored — never commit machine-specific config) and
# edit as needed. Every value shown below is already the built-in default, so this
# file exists purely to document the shape of the config; Ansina runs fine without it.
#
# Precedence, lowest to highest: built-in defaults -> ansina.toml -> ANSINA_* env vars.
# `ANSINA_CONFIG_FILE` points at a different file than the default `./ansina.toml`.

[server]
host = "127.0.0.1"
port = 8000

[logging]
level = "INFO"

[database]
# A relative path resolves against the process's working directory at startup — fine
# when launched from the repo root, ambiguous once Ansina runs as a service. Prefer an
# absolute path (or "~/..." — "~" is expanded) once the database needs to live
# somewhere else, e.g. a larger disk. WAL mode creates "<path>-wal" and "<path>-shm"
# sidecar files next to it; move all three together.
path = "ansina.db"

# Secrets (e.g. the API bearer token) are never read from this file — setting one
# here is a hard startup error. Set it via the environment instead, e.g.:
#   ANSINA_SECURITY__API_TOKEN=...
#
# Binding [server] host to anything other than loopback (127.0.0.1, ::1, localhost)
# while no ANSINA_SECURITY__API_TOKEN is set is also a hard startup error — Ansina
# refuses to expose an unauthenticated API off the local machine. /healthz and /readyz
# stay reachable without a token either way; every other route requires one once a
# token is configured.
