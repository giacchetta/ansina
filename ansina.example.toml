# Example Ansina configuration file.
#
# Copy this to `ansina.toml` (gitignored — never commit machine-specific config) and
# edit as needed. Every value shown below is already the built-in default, so this
# file exists purely to document the shape of the config; Ansina runs fine without it.
#
# Precedence, lowest to highest: built-in defaults -> ansina.toml -> ANSINA_* env vars.
# `ANSINA_CONFIG_FILE` points at a different file than the default `./ansina.toml`.

[server]
host = "127.0.0.1"
port = 8000

[logging]
level = "INFO"

[database]
# A relative path resolves against the process's working directory at startup — fine
# when launched from the repo root, ambiguous once Ansina runs as a service. Prefer an
# absolute path (or "~/..." — "~" is expanded) once the database needs to live
# somewhere else, e.g. a larger disk. WAL mode creates "<path>-wal" and "<path>-shm"
# sidecar files next to it; move all three together.
path = "ansina.db"

[heart]
# The in-process Heart runtime (issue #10). Off by default: no capability probe
# runs, no model loads, and "/readyz" carries no "heart" key at all. Turning this on
# requires the "mlx" extra ("uv sync --extra mlx") and only runs on Apple Silicon —
# a portable fallback is tracked in a follow-up issue, not shipped yet.
enabled = false

# "auto" and "mlx" currently behave identically (MLX is the only adapter); "auto"
# exists so a future adapter can be added without a config break.
runtime = "auto"

# An explicit local path always wins over model_repo below, and is used as-is with
# no network access. Leave unset to fetch model_repo instead.
# model_path = "/path/to/a/local/mlx/model"

# Hugging Face repo id, fetched into cache_dir on first use and reused after —
# ignored when model_path is set.
model_repo = "mlx-community/Qwen3-4B-Instruct-2507-4bit"

# Download-once model cache. Same "~" expansion / relative-path-resolves-to-CWD
# behavior as [database] path above.
cache_dir = "~/.cache/ansina/models"

# Hard ceiling, not a target (blueprint §3) — every prompt built for the Heart must
# fit inside this budget. 8192 is the maximum accepted here.
context_tokens = 8192
max_output_tokens = 512

[heart.tick]
# The autonomic tick loop (issue #11): on a fixed cadence, the Heart decides
# idle/act/escalate. Only runs when [heart] enabled = true above; this flag lets the
# Heart load (e.g. to back a future direct-generate use) without also ticking.
enabled = true

# Seconds between ticks.
interval_seconds = 30.0

# Uniform random delay added to each wakeup, so a restarted process doesn't tick in
# lockstep with anything else on a fixed cadence. 0 disables jitter.
jitter_seconds = 3.0

[brain]
# The remote Brain provider (issue #12). Off by default: "build_brain_provider" is
# never called and "app.state.brain" stays "None". Independent of [heart] — the Brain
# has no dependency on the Heart being enabled.
enabled = false

# Any OpenAI-compatible chat-completions endpoint: OpenAI itself, an
# Anthropic-via-compat-shim, OpenRouter, or a self-hosted server. A keyless request
# against this default host is refused at startup; point this at a keyless custom
# endpoint instead if that's what you're running.
base_url = "https://api.openai.com/v1"
model = "gpt-4o-mini"

timeout_seconds = 60.0
max_output_tokens = 2048

# Bounded retry: only retries a classified-retryable failure, and only before any
# text has reached the caller. "max_retries = 0" disables retry entirely.
max_retries = 3
retry_initial_backoff_seconds = 1.0
retry_max_backoff_seconds = 30.0

# Optional. With no price configured (the default), recorded usage carries no
# "cost_usd" figure rather than a fabricated one.
# price_per_1m_input_tokens = 0.15
# price_per_1m_output_tokens = 0.60

[security]
# RBAC identity model (issue #24, redesigned by #28). true (the default) means
# authentication is enforced: on first boot, Ansina *always* generates its own
# high-entropy bootstrap API token, prints it to stdout exactly once, and stores only
# its hash — never in this file, never recoverable afterward, and never overridable
# or rotatable by any config below. false disables authentication entirely (every
# route except /healthz and /readyz reachable with no token) and is only accepted
# when [server] host is loopback (127.0.0.1, ::1, localhost) — Ansina refuses to
# expose an unauthenticated API off the local machine.
enabled = true

# The bootstrap identity is Ansina's permanent break-glass credential — it can never
# hold more than one token, and nothing below rotates it. Set this to false once a
# real Admin account exists (e.g. the configured admin below, or one created via the
# TUI/API) to revoke its credential (the user record and audit trail are kept, only
# the credential is removed); setting it back to true regenerates a fresh one if it's
# currently credential-less, but never touches a live one.
bootstrap_admin_enabled = true

# admin_username / api_token (issue #28) together provision a second, *ordinary*
# Admin user once, at first boot — the "configured admin," distinct from the
# synthetic bootstrap identity above. This is what a scripted install or CI wants: a
# known, reproducible Admin credential that doesn't require scraping the one-time
# bootstrap banner off stdout. Required together — set neither, or both. Never the
# reserved username "bootstrap-admin". There is no rotation: once created, this
# identity is an ordinary user and mints/revokes its own tokens the same way any
# other user does, via POST/DELETE /auth/me/tokens. On any boot after the first
# (where a non-bootstrap user already exists), both are silently ignored — a
# systemd unit or container that keeps the same environment across every restart
# must not fail on a routine one.
#
# admin_username has no secrecy requirement and may be set in this file:
#   admin_username = "ops-admin"
#
# api_token, like every secret, is env-only — setting it in this file is a hard
# startup error. Must look like a securely generated value (32+ chars,
# letters/digits/-/_ only, high enough entropy) — a human-typed phrase like
# "Hello, World" is rejected outright:
#   ANSINA_SECURITY__ADMIN_USERNAME=ops-admin
#   ANSINA_SECURITY__API_TOKEN=...
#   ANSINA_BRAIN__API_KEY=...
#
# Generate a strong one with e.g.:
#   python -c "import secrets; print(secrets.token_urlsafe(32))"

# How long a token's last_used_at may go stale before the next successful
# authentication updates it (issue #28) — coalesced rather than written on every
# request, since the authentication lookup already full-scans credentials on every
# request and a write there would serialize SQLite writers against the tick loop.
# 0 means "write on every authentication."
token_last_used_resolution_seconds = 300.0

[security.password]
# Tunable argon2id work factors (issue #24). Defaults follow the OWASP-recommended
# argon2id baseline — high enough to make brute-forcing a stolen hash expensive, low
# enough not to dominate a login request.
time_cost = 3
memory_cost_kib = 65536
parallelism = 4

# Password acceptability policy (issue #48), enforced at every password-setting path:
# POST /auth/users, PUT /auth/users/{id}/password, and PUT /auth/me/password.
# Deliberately no character-class/composition rules (no forced digit/symbol/mixed
# case) -- per NIST SP 800-63B, which is also why min_length is bounded below: it's
# configurable down, but never under 8, that standard's own stated minimum for a
# user-chosen secret. max_length is an argon2 work-factor DoS ceiling, not a strength
# rule -- it bounds how large an input a caller can force an expensive hash over.
min_length = 12
max_length = 1024

# Whether a submitted password is checked against the bundled common-password
# rejection list (src/ansina/auth/data/common_passwords.txt, ~2,100 entries derived
# from a public top-10k breach corpus, filtered to >= 8 characters).
reject_common = true

[security.sudo]
# Sudo step-up (issue #26): a Maintain caller must present a live grant on any
# sensitive auth.* action (Admin never does). Get one via POST /auth/sudo (body:
# {"password": "..."}), present it back as the X-Sudo-Token header.

# How long an issued grant stays valid.
ttl_seconds = 600.0

# N consecutive failed step-up attempts within attempt_window_seconds locks further
# attempts out for lockout_seconds (429 with a Retry-After header).
max_failed_attempts = 5
attempt_window_seconds = 300.0
lockout_seconds = 900.0

[security.login]
# Login throttle (issue #49): per-username and per-IP brute-force protection for
# POST /auth/login (#50). Deliberately separate from [security.sudo] above -- an
# anonymous login attempt is a different caller and threat model than an
# already-authenticated step-up, so the two are independently tunable.
#
# Two independent thresholds: max_failed_attempts_per_username catches repeated
# guesses against one account (throttled identically whether or not that username
# exists, so the throttle itself can't be used to enumerate valid usernames);
# max_failed_attempts_per_ip (a higher ceiling, since one IP legitimately serves many
# users) catches a spray across many distinct usernames that never trips any single
# username bucket.
max_failed_attempts_per_username = 5
max_failed_attempts_per_ip = 20
attempt_window_seconds = 900.0
lockout_seconds = 900.0

# How long the api_token minted at the end of a successful POST /auth/login stays
# valid -- mirrors [security.oidc]'s own token_ttl_seconds below, a separate knob per
# feature rather than one shared setting.
token_ttl_seconds = 3600.0

[security.encryption]
# AES-GCM key for TOTP secrets at rest (issue #41, "ansina.auth.encryption"). Unset by
# default -- nothing needs it until a user enrolls TOTP via POST /auth/me/totp, but
# Ansina refuses to boot if any TOTP enrollment already exists with no key configured.
#
# Like every secret, this is env-only -- setting it in this file is a hard startup
# error. Must decode to exactly 32 raw bytes (url-safe base64, the same shape
# secrets.token_urlsafe(32) produces):
#   ANSINA_SECURITY__ENCRYPTION__KEY=...
#
# Generate one with e.g.:
#   python -c "import secrets; print(secrets.token_urlsafe(32))"
#
# There is no re-encryption/rotation path: losing or rotating this key means any
# existing TOTP enrollments must be cleared (DELETE /auth/users/{id}/totp) and
# re-enrolled from scratch.
# key = "..."

[security.oidc]
# OAuth 2.0 / OIDC federated login (issue #43): POST /auth/oidc/login starts a login,
# GET /auth/oidc/callback completes it. Both are public routes (reachable with no
# bearer token, even with security.enabled = true) -- a caller can't hold a token
# before it has logged in. false (the default) means neither route does anything but
# answer 503; enabling performs no network call at boot, so an unreachable or
# misconfigured IdP only ever fails an individual login, never startup.
enabled = false

# The IdP's issuer URL -- discovery is fetched from
# "<issuer>/.well-known/openid-configuration" on every login (never cached, so an
# IdP's own key rotation takes effect on the very next one). A trailing slash is
# stripped automatically. Required when enabled = true.
# issuer = "https://idp.example.com"

# This client's registered id with the IdP. Required when enabled = true.
# client_id = "ansina"

# Where the IdP redirects back to after login -- must match what's registered with
# the IdP. Required when enabled = true.
# redirect_uri = "http://127.0.0.1:8000/auth/oidc/callback"

# Scopes requested at the authorization endpoint. "openid" is required by the OIDC
# spec itself; "profile"/"email" back the preferred_username/email fallback chain
# just-in-time provisioning derives a username from.
scopes = ["openid", "profile", "email"]

# How long the api_token minted at the end of a successful login stays valid.
token_ttl_seconds = 3600.0

# How long an issued state/nonce/PKCE code_verifier may sit unconsumed (i.e. how long
# a browser may sit on the IdP's login page) before the flow must be restarted.
state_ttl_seconds = 600.0

# Timeout for every outbound call to the IdP (discovery, JWKS, token exchange).
http_timeout_seconds = 10.0

# client_secret, like every secret, is env-only -- setting it in this file is a hard
# startup error. Required together with issuer/client_id/redirect_uri when
# enabled = true:
#   ANSINA_SECURITY__OIDC__CLIENT_SECRET=...

[security.cors]
# Cross-Origin Resource Sharing (issue #51), for a browser-hosted third-party
# dashboard on another origin -- without this, a browser cannot call Ansina's REST
# API at all, and the failure is reported by the browser, never by Ansina, so it's
# invisible in the daemon's own logs. false (the default) adds no CORS middleware
# at all -- the daemon + ansina-tui deployment (which is not a browser and never
# sends an Origin header) is byte-for-byte unchanged.
enabled = false

# Every entry must be an exact "scheme://host[:port]" origin, the same string a
# browser sends in its Origin header -- compared exactly, so list each one that
# needs access. A trailing slash is stripped automatically (the same footgun
# [security.oidc] issuer strips one for). "*" is refused outright, even with
# enabled = false: every Ansina route but the health probes and the login routes
# is authenticated, and a wildcard origin on a credential-bearing API is never the
# right answer. Required (non-empty) when enabled = true.
# allowed_origins = ["https://dashboard.example.com"]

# How long a browser may cache a preflight's answer before repeating it.
max_age_seconds = 600

# No allow_credentials setting exists: Ansina authenticates with an Authorization
# header, never a cookie, so there is nothing for a credentialed CORS mode to
# protect -- it would only add CSRF surface for no benefit.
